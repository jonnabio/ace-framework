name: Validate Framework

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Structure
        run: |
          echo "Validating ACE-Framework structure..."

          # Required directories
          dirs=(".ace" ".ace/standards" ".ace/skills" ".ace/roles" ".ace/knowledge" "docs" "docs/adr" "docs/context" "docs/rca")
          for dir in "${dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing directory: $dir"
              exit 1
            fi
            echo "✓ Directory exists: $dir"
          done

          # Required files
          files=(".aceconfig" "README.md" "ACE-SPEC.md" ".ace/roles/roles.md" "docs/context/ACTIVE_CONTEXT.md")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing file: $file"
              exit 1
            fi
            echo "✓ File exists: $file"
          done

          echo "✅ Framework structure is valid!"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install lint tooling
        run: npm ci

      - name: Validate Markdown
        # Runs the pinned markdownlint-cli2 from package-lock.json, reading
        # globs and rules from .markdownlint-cli2.jsonc. Identical to what
        # `npx markdownlint-cli2` runs locally and to the verify gate's
        # lint_cmd. The marketplace action was dropped because it bundles its
        # own version, which the lockfile cannot pin.
        run: npx markdownlint-cli2

      - name: Check YAML Syntax
        # Was an inline `python3 -c ... && echo ok || echo bad` loop, which
        # printed failures and still exited 0. The script exits non-zero, and
        # also covers .aceconfig and .aceconfig-ext, which no *.yml glob
        # matches and which every agent reads first.
        run: bash scripts/check-yaml.sh

      - name: Validate Links (advisory, does not gate)
        uses: lycheeverse/lychee-action@v2
        with:
          # node_modules must be excluded: the lint tooling is installed
          # before this step, and without it lychee walks every dependency
          # README. Measured at 3587 links in 9m27s, versus 75 in 0.8s for the
          # repository's own documents. .ace/packs is vendored and excluded
          # for the same reason it is excluded from linting.
          args: >-
            --verbose --no-progress
            --exclude-path node_modules --exclude-path .ace/packs
            '**/*.md'
          fail: false
