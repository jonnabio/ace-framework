name: Validate Framework

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install lint tooling
        run: npm ci

      - name: Validate Structure
        # scripts/validate.sh, not an inline copy of part of it. The block
        # that lived here checked 9 directories and 5 files; the script checks
        # those plus the standards, skills, templates and task-queue files,
        # and validates docs/progress/tasks.json against its schema. It runs
        # after Setup Node because that last check shells out to node.
        run: bash scripts/validate.sh

      - name: Verify Gate
        # The same gate the Stop hook and the loop runner use, in its full
        # profile: the CLI test suite (test_cmd) followed by markdown lint
        # (lint_cmd), both named in .aceconfig. CI had never run the test
        # suite at all, and ran lint from a second definition of its own that
        # was free to drift from the local one.
        #
        # markdownlint-cli2 resolves to the version pinned in
        # package-lock.json because `npm ci` ran above.
        run: bash .ace/scripts/verify.sh

      - name: Check Encoding
        # This repository has been corrupted by double-encoded UTF-8 twice,
        # and both times a human found it rather than CI. 1744 characters
        # across 15 files (68d0f52), then 12 more in AGENTS.md that the first
        # sweep missed (7aad699).
        run: bash scripts/check-encoding.sh

      - name: Check YAML Syntax
        # Was an inline `python3 -c ... && echo ok || echo bad` loop, which
        # printed failures and still exited 0. The script exits non-zero, and
        # also covers .aceconfig and .aceconfig-ext, which no *.yml glob
        # matches and which every agent reads first.
        run: bash scripts/check-yaml.sh

      - name: Validate Internal Links
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline resolves only links to files in this repository, so this
          # step is deterministic: it fails on a link to a document that does
          # not exist, and never on someone else's server being down. That is
          # what makes it safe to gate on.
          #
          # node_modules must be excluded: the lint tooling is installed
          # before this step, and without it lychee walks every dependency
          # README. .ace/packs is vendored and excluded for the same reason it
          # is excluded from linting.
          args: >-
            --offline --verbose --no-progress
            --exclude-path node_modules --exclude-path .ace/packs
            '**/*.md'
          fail: true

      - name: Validate External Links (advisory, does not gate)
        uses: lycheeverse/lychee-action@v2
        with:
          # External links rot for reasons that have nothing to do with the
          # pull request in front of them, so this one reports and does not
          # block. Its name says so, because a green check that cannot fail is
          # otherwise read as a check that passed.
          args: >-
            --verbose --no-progress
            --exclude-path node_modules --exclude-path .ace/packs
            '**/*.md'
          fail: false
