name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Without this the clone is depth 1, HEAD^ does not exist, and the
          # changelog step below silently falls back to "last 20 commits" on
          # every release.
          fetch-depth: 0

      - name: Create Release Archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Create archive without git history
          git archive --format=zip --prefix=ace-framework/ HEAD -o ace-framework-${VERSION}.zip
          git archive --format=tar.gz --prefix=ace-framework/ HEAD -o ace-framework-${VERSION}.tar.gz

      - name: Generate Changelog
        id: changelog
        run: |
          set -euo pipefail
          echo "Generating changelog..."

          # `git describe` fails both when there is no earlier tag and when the
          # clone has no history to search. Those need different handling, so
          # count the tags rather than swallowing the error with `|| echo ""`.
          TAG_COUNT=$(git tag --list 'v*' | wc -l | tr -d ' ')
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            HEADER="Changes since ${PREV_TAG}:"
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          elif [ "$TAG_COUNT" -le 1 ]; then
            HEADER="First tagged release. Full history:"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "::error::${TAG_COUNT} tags exist but no previous tag could be resolved from HEAD^."
            echo "::error::The checkout is probably shallow; the changelog would be wrong."
            exit 1
          fi

          {
            echo "changelog<<ACE_EOF"
            echo "$HEADER"
            echo ""
            echo "$CHANGELOG"
            echo "ACE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ace-framework-*.zip
            ace-framework-*.tar.gz
          body: |
            ## ACE-Framework ${{ github.ref_name }}

            ### Installation

            **Option 1: Use as GitHub Template**
            Click "Use this template" on the repository page.

            **Option 2: CLI**
            ```bash
            npx create-ace-framework my-project
            ```

            **Option 3: Download**
            Download the archive below and extract to your project.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
